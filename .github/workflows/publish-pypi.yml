name: Publish to PyPI

# Runs when you publish a GitHub Release. Publishes eubi-bridge and
# eubi-bridge-lite to PyPI via Trusted Publishing (OIDC) -- no token is stored
# in the repo. Both come from the release's commit and the same version:
#
#   1. the release tag must equal the version in pyproject.toml (vX.Y.Z);
#   2. the full test suite runs on that commit (test.yml); nothing is built or
#      published unless it passes;
#   3. both packages are built and uploaded.
#
# If one upload failed, "Re-run failed jobs" on the run retries only that one.
# If the tests failed: fix, delete the release and its tag, and release again.
#
# Keep this file's name: the PyPI trusted publishers of both projects are
# registered for publish-pypi.yml.
#
# eubi-bridge: only the sdist is published (not a wheel). The custom build
# backend (_build_backend.py) bundles a platform-specific JDK at build time,
# so a CI-built wheel would be Linux-only and break Windows/macOS installs.
# The sdist carries no JDK (only the Bio-Formats JARs); the correct
# per-platform JDK is fetched when each user installs.
#
# eubi-bridge-lite: the same eubi_bridge package without Bio-Formats, built
# by tools/build_lite.py as a pure wheel (py3-none-any, no JDK, no JARs) and
# an sdist.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release tag equals pyproject.toml's version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}" \
            || { echo "::error::release tag ${{ github.event.release.tag_name }} != v$version (pyproject.toml)"; exit 1; }

  tests:
    needs: checks
    uses: ./.github/workflows/test.yml

  build:
    name: Build eubi-bridge (sdist)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build & check sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-lite:
    name: Build eubi-bridge-lite (wheel + sdist)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build & check
        run: |
          python -m pip install --upgrade build twine
          python tools/build_lite.py --outdir dist-lite
          twine check dist-lite/*

      - name: The wheel is pure and carries no Bio-Formats
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          (wheel,) = glob.glob("dist-lite/*.whl")
          if not wheel.endswith("-py3-none-any.whl"):
              sys.exit(f"not a pure wheel: {wheel}")
          names = zipfile.ZipFile(wheel).namelist()
          if any("/bioformats/" in n for n in names):
              sys.exit("the lite wheel contains Bio-Formats files")
          print(wheel, len(names), "files")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lite-dist
          path: dist-lite/*

  publish:
    name: Publish eubi-bridge
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token: authenticates via OIDC Trusted Publishing.

  publish-lite:
    name: Publish eubi-bridge-lite
    needs: build-lite
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # Trusted Publishing: a publisher for the
                               # eubi-bridge-lite project, this workflow file
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lite-dist
          path: dist-lite

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-lite/

name: EuBI-Bridge Test Suite

on:
  push:
    branches: [ main, develop, bf_bundled ]
  pull_request:
    branches: [ main, develop, bf_bundled ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  # Manual "Run workflow" button (Actions tab) — pick a branch (e.g. dev) from
  # the ref dropdown to run the suite on demand instead of on every push.
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      # CI runners have no display; Qt needs a platform plugin to initialise,
      # so the GUI tests can actually run rather than skip.
      QT_QPA_PLATFORM: offscreen
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache downloaded test data
      # Small public sample files fetched by the tests themselves (e.g. a Zeiss
      # CZI mosaic from Zenodo 7015307, CC-BY-4.0), verified by MD5; cached so
      # each runner downloads them once rather than on every run.
      uses: actions/cache@v4
      with:
        path: ~/.cache/eubi-bridge-test-data
        key: eubi-test-data-v1

    - name: Install Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        # PyQt6 pip-installs cleanly but cannot load without these, so the GUI
        # tests would silently skip and never be exercised on any platform.
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        echo "Installing eubi_bridge with all extras..."
        pip install -e ".[all]" -v
        echo "Installing additional test dependencies..."
        pip install pytest pytest-cov numpy tifffile imageio-ffmpeg zarr
        echo "Verifying installation..."
        python -c "import eubi_bridge; import zarr; import tifffile; import numpy; print('[SUCCESS] All packages imported successfully')"
        echo "Checking for eubi executable..."
        python -c "import shutil; eubi = shutil.which('eubi'); print(f'eubi found: {eubi}')" || echo "eubi not in PATH, will be discovered at runtime"
    
    - name: Verify eubi executable is accessible
      run: |
        echo "Checking for eubi executable..."
        python -c "import shutil, sys, os; scripts_dir = os.path.join(sys.prefix, 'Scripts'); print(f'Python: {sys.executable}'); print(f'sys.prefix: {sys.prefix}'); print(f'Scripts dir: {scripts_dir}'); print(f'Scripts exists: {os.path.exists(scripts_dir)}'); eubi = shutil.which('eubi'); print(f'eubi found: {eubi}')"
        echo "Contents of Scripts directory (if it exists):"
        python -c "import os, sys; scripts_dir = os.path.join(sys.prefix, 'Scripts'); print([f for f in os.listdir(scripts_dir) if 'eubi' in f.lower() or f.endswith('.exe')] if os.path.exists(scripts_dir) else 'Scripts directory does not exist (normal on Unix platforms)')"
        echo "Reinstalling with verbose to check for setup.py entry_points..."
        pip install -e ".[all]" --force-reinstall --no-cache-dir 2>&1 | head -100
        echo "Checking for eubi again after reinstall..."
        python -c "import shutil; eubi = shutil.which('eubi'); print(f'After reinstall, eubi found: {eubi}')"
    
    - name: Verify the GUI test stack is usable
      run: |
        # Guard against the GUI tests silently skipping: if Qt cannot start,
        # they would be reported as passing while never running anywhere.
        python -c "from PyQt6.QtWidgets import QApplication; QApplication([]); print('[SUCCESS] Qt initialised')"

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short --color=yes
      env:
        # Disable JVM network access in offline-friendly mode
        MAVEN_OFFLINE: 'true'
        JGO_CACHE_DIR: '/dev/null'
    
    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=eubi_bridge --cov-report=xml --cov-report=term-missing -v
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
      continue-on-error: true

  lite:
    # eubi-bridge-lite: the wheel tools/build_lite.py builds, installed ALONE
    # (none of the Bio-Formats / dask stack), on every Python lite supports.
    # The tests run from a copy outside the source tree, so the installed
    # package is the one tested; tests that need the full stack skip
    # (tests/conftest.py: requires_full).
    name: Lite on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache downloaded test data
      uses: actions/cache@v4
      with:
        path: ~/.cache/eubi-bridge-test-data
        key: eubi-test-data-v1

    - name: Install Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

    - name: Build eubi-bridge-lite
      shell: bash
      run: |
        python -m pip install --upgrade pip build
        python tools/build_lite.py --outdir dist-lite
        ls -l dist-lite

    - name: Install the lite wheel alone
      shell: bash
      run: |
        python -m pip install dist-lite/*.whl pytest
        python - <<'PY'
        import importlib.util, sys
        full = ("bioio_base", "bfio", "scyjava", "jpype", "dask", "distributed",
                "dask_jobqueue", "aicspylibczi", "pylibCZIrw", "nd2", "readlif")
        present = [m for m in full if importlib.util.find_spec(m)]
        if present:
            sys.exit(f"eubi-bridge-lite pulled in the full stack: {present}")
        import eubi_bridge
        assert eubi_bridge.__distribution__ == "eubi-bridge-lite", eubi_bridge.__distribution__
        print("lite", eubi_bridge.__version__, "from", eubi_bridge.__file__)
        PY
        eubi version

    - name: Verify the GUI test stack is usable
      run: |
        python -c "from PyQt6.QtWidgets import QApplication; QApplication([]); print('[SUCCESS] Qt initialised')"

    - name: Copy the tests out of the source tree
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/lite-run/docs"
        cp -r tests "$RUNNER_TEMP/lite-run/"
        cp -r docs/scripts "$RUNNER_TEMP/lite-run/docs/"

    - name: Run the tests against the installed lite package
      working-directory: ${{ runner.temp }}/lite-run
      run: |
        python -m pytest tests -v --tb=short --color=yes -rs

  lint:
    name: Lint with Pylance
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[all]" --no-build-isolation -v
        pip install pylint
    
    - name: Verify eubi executable is accessible
      run: |
        echo "Checking for eubi executable..."
        python -c "import shutil, sys, os; scripts_dir = os.path.join(sys.prefix, 'Scripts'); print(f'Python: {sys.executable}'); print(f'sys.prefix: {sys.prefix}'); print(f'Scripts dir: {scripts_dir}'); print(f'Scripts exists: {os.path.exists(scripts_dir)}'); eubi = shutil.which('eubi'); print(f'eubi found: {eubi}')"
        echo "Contents of Scripts directory (if it exists):"
        python -c "import os, sys; scripts_dir = os.path.join(sys.prefix, 'Scripts'); print([f for f in os.listdir(scripts_dir) if 'eubi' in f.lower() or f.endswith('.exe')] if os.path.exists(scripts_dir) else 'Scripts directory does not exist (normal on Unix platforms)')"
    
    - name: Run pylint
      run: |
        pylint eubi_bridge --disable=all --enable=E,F --exit-zero
      continue-on-error: true

  integration-test:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    env:
      # CI runners have no display; Qt needs a platform plugin to initialise,
      # so the GUI tests can actually run rather than skip.
      QT_QPA_PLATFORM: offscreen
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install Qt system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        # PyQt6 pip-installs cleanly but cannot load without these, so the GUI
        # tests would silently skip and never be exercised on any platform.
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        echo "Installing eubi_bridge with all extras..."
        pip install -e ".[all]" -v
        echo "Installing additional test dependencies..."
        pip install pytest pytest-cov numpy tifffile imageio-ffmpeg zarr
        echo "Verifying installation..."
        python -c "import eubi_bridge; import zarr; import tifffile; import numpy; print('[SUCCESS] All packages imported successfully')"
        echo "Checking for eubi executable..."
        python -c "import shutil; eubi = shutil.which('eubi'); print(f'eubi found: {eubi}')" || echo "eubi not in PATH, will be discovered at runtime"
    
    - name: Run integration tests
      run: |
        pytest tests/test_unary_conversions.py tests/test_aggregative_conversions.py -v --tb=short -x
      env:
        MAVEN_OFFLINE: 'true'
        JGO_CACHE_DIR: '/dev/null'

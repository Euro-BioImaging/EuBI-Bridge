[build-system]
# setuptools >= 77 is required for the PEP 639 `license = "MIT"` form below;
# older versions reject it with "project.license must be valid exactly by one
# definition", which fails the build rather than degrading gracefully.
requires = ["setuptools>=77", "wheel", "packaging"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "eubi_bridge"
version = "0.3.1"
description = "A package for converting datasets to OME-Zarr format."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Bugra Özdemir", email = "bugraa.ozdemir@gmail.com"}
]
license = "MIT"
dependencies = [
    "aicspylibczi>=0.0.0",
    "bfio>=0.0.0",
    "bioformats_jar>=0.0.0",
    "bioio-base==3.3.0",
    "bioio-czi==2.1.0",
    "bioio-imageio==1.1.0",
    "bioio-lif==1.1.0",
    "bioio-nd2==1.1.0",
    "bioio-ome-tiff-fork-by-bugra==0.0.1b2",
    "bioio-tifffile-fork-by-bugra>=0.0.1b2",
    "dask>=2024.12.1",
    "dyna-zarr>=0.1.0,<0.2",
    "ome_zarr_pyramid[remote]>=0.3.1,<0.4",
    "dask-jobqueue>=0.0.0",
    "distributed>=2024.12.1",
    "micro-reader>=0.1.0,<0.2",
    "natsort>=0.0.0",
    "nd2>=0.0.0",
    "numpy>=1.24",
    "pydantic>=2.11.7",
    "pylibczirw>=0.0.0",
    "PyQt6>=6.6.0,<=6.9.1",
    "readlif==0.6.5",
    "s3fs>=0.0.0",
    "tensorstore>=0.0.0",
    "tifffile>=2025.5.21,<2026",
    "xarray>=0.0.0",
    "zarr>=3.0,<3.2",
    "psutil>=7.0.0",
    "rich>=14.1.0",
    "h5py",
    "fire>=0.0.0",
    # imported by eubi_bridge directly; used to arrive only through other
    # packages (bioio; imageio / matplotlib for Pillow, the GUI viewer's)
    "ome-types",
    "pandas",
    "pillow",
]
# PyTorch must be installed separately to match the local CUDA version.
# CPU-only:  pip install torch
# CUDA 12.x: pip install torch --index-url https://download.pytorch.org/whl/cu121
# Or use the convenience extra (CPU-only fallback):
#   pip install "eubi_bridge[deep]"

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
flow     = ["eubi-flow>=0.1.2b8"]
annotate = ["eubi-annotate>=0.1.2b8"]
deep     = ["eubi-deep>=0.1.2b8"]
docs     = ["mkdocs-material>=9.5", "pymdown-extensions>=10.0"]
test     = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.package-data]
eubi_bridge = [
    "bioformats/**",
    "qt_gui/server/**",
    "qt_gui/*.webp",
]

[project.scripts]
eubi = "eubi_bridge.cli:main"
eubi-gui = "eubi_bridge.qt_gui.app:main"

[project.urls]
Homepage = "https://github.com/Euro-BioImaging/EuBI-Bridge"

[tool.eubi-bridge.lite]
# eubi-bridge-lite: the same eubi_bridge package, without Bio-Formats (the
# JARs, the JDK, bioio, bfio, the JVM) and without dask.  tools/build_lite.py
# builds it from this source tree.  Every dependency here is also in
# [project] dependencies, with the same specifier
# (tests/test_lite_packaging.py checks it).
name = "eubi-bridge-lite"
description = "Convert microscopy images to OME-Zarr: eubi-bridge without Java and Bio-Formats."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "zarr>=3.0,<3.2",
    "tensorstore>=0.0.0",
    "tifffile>=2025.5.21,<2026",
    "micro-reader>=0.1.0,<0.2",
    "ome_zarr_pyramid[remote]>=0.3.1,<0.4",
    "dyna-zarr>=0.1.0,<0.2",
    "h5py",
    "ome-types",
    "pydantic>=2.11.7",
    "pandas",
    "natsort>=0.0.0",
    "psutil>=7.0.0",
    "rich>=14.1.0",
    "fire>=0.0.0",
    "s3fs>=0.0.0",
    "PyQt6>=6.6.0,<=6.9.1",
    "pillow",
]

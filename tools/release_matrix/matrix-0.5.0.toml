# Version matrix for micro-reader 0.5.0 (2026-11-17: the native read engine micro-reader-core
# 0.0.1, micro-reader-codecs 0.0.5, read_many; no API removed). All three on PyPI.
# The released eubi-bridge / eubi-bridge-lite 0.4.0 and 0.4.1 pin micro-reader[codecs]>=0.4.1,<0.5,
# so pip must refuse them together with 0.5.0 (unresolvable) and a fresh install must keep 0.4.5.
# An environment where 0.5.0 is forced in anyway (pip install -U micro-reader) is checked by hand
# with --no-deps, outside this file. PyPI only:
#     python matrix.py plan    --config matrix-0.5.0.toml --pypi
#     python matrix.py run     --config matrix-0.5.0.toml --pypi
#     python matrix.py resolve --config matrix-0.5.0.toml --pypi

stack = ["micro-reader-codecs", "micro-reader-core", "micro-reader", "zarr-zip", "dyna-zarr",
         "ome-zarr-pyramid", "eubi-bridge", "eubi-bridge-lite"]

smoke_timeout_s = 900

fallback_patterns = ['older readers \(', 'standard reader \(', 'Bio-Formats metadata']

[paths]
workdir = "C:/Users/oezdemir/.eubi-matrix/m50"

[pythons]
eubi = "C:/Users/oezdemir/miniforge3/envs/pythonenv/python.exe"
build = "C:/Users/oezdemir/.eubi-matrix/bvenv041/Scripts/python.exe"

[samples]
czi = "C:/Users/oezdemir/Desktop/data/microscopy/formats/czi/assorted/xyz__multiple_images.czi"
lif = "C:/Users/oezdemir/Desktop/data/microscopy/formats/lif/ome-samples/20191025 Test FRET 585. 423, 426.lif"
plate = "C:/Users/oezdemir/Desktop/data/microscopy/plates/cv7000/bia-S-BIAD1013-cv7000/1093684368.wpi"
bdv = "C:/Users/oezdemir/Desktop/data/microscopy/formats/h5/bdv/osf-bufza-bigstitcher/grid-3d-stitched-h5/dataset.xml"
jxr = "C:/Users/oezdemir/Desktop/data/microscopy/formats/czi/os-zeiss/Zeiss-5-JXR.czi"

[axes]
dyna-zarr = ["0.1.4"]
micro-reader = ["0.4.5", "0.5.0"]

[[consumers]]
name = "eubi-bridge"
versions = ["0.4.0", "0.4.1"]
python = "eubi"
samples = ["czi", "lif", "plate", "bdv", "jxr"]
smoke = ["{bin}/eubi", "to_zarr", "{sample}", "{out}"]

[[consumers]]
name = "eubi-bridge-lite"
versions = ["0.4.0", "0.4.1"]
python = "eubi"
samples = ["czi", "lif", "plate", "bdv", "jxr"]
smoke = ["{bin}/eubi", "to_zarr", "{sample}", "{out}"]

# The released eubi pins micro-reader <0.5: pip cannot install them together.
[[expect]]
when = { eubi-bridge = "<0.5.0", micro-reader = ">=0.5.0" }
outcome = "unresolvable"
[[expect]]
when = { eubi-bridge-lite = "<0.5.0", micro-reader = ">=0.5.0" }
outcome = "unresolvable"

[[resolve]]
name = "fresh eubi-bridge (should keep micro-reader 0.4.5)"
python = "eubi"
requirements = ["eubi-bridge"]

[[resolve]]
name = "fresh eubi-bridge-lite (should keep micro-reader 0.4.5)"
python = "eubi"
requirements = ["eubi-bridge-lite"]

[[resolve]]
name = "fresh micro-reader alone (should take 0.5.0 with core 0.0.1 and codecs 0.0.5)"
python = "eubi"
requirements = ["micro-reader"]

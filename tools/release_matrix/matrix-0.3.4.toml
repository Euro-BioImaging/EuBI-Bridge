# Version matrix for the 2026-10-30 train: micro-reader 0.4.0 (one naming rule for
# images, axes="canonical" by default, open(folder) opens the one dataset below it,
# select() raises on unknown plate names), ome-zarr-pyramid 0.6.0 (select() raises on
# unknown plate names, vendor spellings compare equal) and eubi-bridge / eubi-bridge-lite
# 0.3.4 (requires micro-reader>=0.4.0,<0.5 and ome_zarr_pyramid>=0.6.0,<0.7: the older ones
# invent calibration; reads micro-reader in the backend's axis order).
#     python matrix.py build   --config matrix-0.3.4.toml
#     python matrix.py run     --config matrix-0.3.4.toml
#     python matrix.py resolve --config matrix-0.3.4.toml
# The released eubi 0.3.3 must keep its stack (micro-reader <0.4, ozp <0.6); 0.3.4 must
# pass with micro-reader 0.4.0 and ozp 0.6.0 and not resolve with the older ones (an
# upgrade that kept micro-reader 0.3 or ozp 0.5 wrote invented units, tenth review).
# micro-reader-codecs 0.0.2 and dyna-zarr 0.1.x come from PyPI.

stack = ["micro-reader-codecs", "micro-reader", "dyna-zarr", "ome-zarr-pyramid",
         "eubi-bridge", "eubi-bridge-lite"]

smoke_timeout_s = 900

fallback_patterns = ['older readers \(', 'standard reader \(', 'Bio-Formats metadata']

[paths]
workdir = "C:/Users/oezdemir/.eubi-matrix/m34"

[pythons]
eubi = "C:/Users/oezdemir/miniforge3/envs/pythonenv/python.exe"
build = "C:/Users/oezdemir/.eubi-matrix/bvenv033/Scripts/python.exe"

[samples]
czi = "C:/Users/oezdemir/Desktop/data/microscopy/formats/czi/assorted/xyz__multiple_images.czi"
lif = "C:/Users/oezdemir/Desktop/data/microscopy/formats/lif/ome-samples/20191025 Test FRET 585. 423, 426.lif"
plate = "C:/Users/oezdemir/Desktop/data/microscopy/plates/cv7000/bia-S-BIAD1013-cv7000/1093684368.wpi"

# The candidates, from the working trees (uncommitted changes included).
[candidates.micro-reader]
path = "C:/Users/oezdemir/Desktop/vscode_projects/WS-EuBI-Bridge/incubation/micro-reader/python"

[candidates.ome-zarr-pyramid]
path = "C:/Users/oezdemir/Desktop/vscode_projects/WS-OmeZarrPyramid/ome_zarr_pyramid"

[candidates.eubi-bridge]
path = "C:/Users/oezdemir/Desktop/vscode_projects/WS-EuBI-Bridge"

[candidates.eubi-bridge-lite]
path = "C:/Users/oezdemir/Desktop/vscode_projects/WS-EuBI-Bridge"
command = ["{python}", "tools/build_lite.py"]
dist = "dist"

[axes]
micro-reader = ["0.2.1", "0.3.0", "candidate"]
ome-zarr-pyramid = ["0.5.0", "candidate"]

[[consumers]]
name = "eubi-bridge"
versions = ["0.3.3", "candidate"]
python = "eubi"
samples = ["czi", "lif", "plate"]
smoke = ["{bin}/eubi", "to_zarr", "{sample}", "{out}"]

[[consumers]]
name = "eubi-bridge-lite"
versions = ["0.3.3", "candidate"]
python = "eubi"
samples = ["czi", "lif", "plate"]
smoke = ["{bin}/eubi", "to_zarr", "{sample}", "{out}"]

# Expectations, first match wins; default "pass".
# eubi 0.3.3 bounds micro-reader <0.4 and ozp <0.6.
[[expect]]
when = { eubi-bridge = "==0.3.3", micro-reader = ">=0.4.0" }
outcome = "unresolvable"
[[expect]]
when = { eubi-bridge = "==0.3.3", ome-zarr-pyramid = ">=0.6.0" }
outcome = "unresolvable"
[[expect]]
when = { eubi-bridge-lite = "==0.3.3", micro-reader = ">=0.4.0" }
outcome = "unresolvable"
[[expect]]
when = { eubi-bridge-lite = "==0.3.3", ome-zarr-pyramid = ">=0.6.0" }
outcome = "unresolvable"
# eubi 0.3.4 needs micro-reader >=0.4.0 and ozp >=0.6.0.
[[expect]]
when = { eubi-bridge = ">=0.3.4", micro-reader = "<0.4.0" }
outcome = "unresolvable"
[[expect]]
when = { eubi-bridge = ">=0.3.4", ome-zarr-pyramid = "<0.6.0" }
outcome = "unresolvable"
[[expect]]
when = { eubi-bridge-lite = ">=0.3.4", micro-reader = "<0.4.0" }
outcome = "unresolvable"
[[expect]]
when = { eubi-bridge-lite = ">=0.3.4", ome-zarr-pyramid = "<0.6.0" }
outcome = "unresolvable"

[[resolve]]
name = "fresh eubi-bridge (with the candidates)"
python = "eubi"
requirements = ["eubi-bridge"]

[[resolve]]
name = "fresh eubi-bridge-lite (with the candidates)"
python = "eubi"
requirements = ["eubi-bridge-lite"]

[[resolve]]
name = "eubi-bridge<0.3.4 (stay on 0.3.3 with micro-reader 0.3, ozp 0.5)"
python = "eubi"
requirements = ["eubi-bridge<0.3.4"]

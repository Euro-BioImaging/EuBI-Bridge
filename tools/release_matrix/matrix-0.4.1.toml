# Version matrix for the 2026-11-12 patch train: dyna-zarr 0.1.4 (write_levels shapes regions
# after the input's tiles) and eubi-bridge / eubi-bridge-lite 0.4.1 ('auto' regions grow with
# the budget; joins open each file once per pass). Pins unchanged from 0.4.0
# (micro-reader>=0.4.1,<0.5, ome_zarr_pyramid>=0.6.1,<0.7, dyna-zarr>=0.1.3,<0.2), so every
# cell should pass: the released eubi 0.4.0 with the new dyna, and 0.4.1 with the old one.
# micro-reader 0.4.2 and 0.4.3 (+ micro-reader-codecs 0.0.4: faster Zeiss JPEG XR, released
# 2026-11-12) come from PyPI. The JPEG XR sample exercises 0.4.3's direct B, G, R decode.
#     python matrix.py build   --config matrix-0.4.1.toml
#     python matrix.py run     --config matrix-0.4.1.toml
#     python matrix.py resolve --config matrix-0.4.1.toml

stack = ["micro-reader-codecs", "micro-reader", "zarr-zip", "dyna-zarr", "ome-zarr-pyramid",
         "eubi-bridge", "eubi-bridge-lite"]

smoke_timeout_s = 900

fallback_patterns = ['older readers \(', 'standard reader \(', 'Bio-Formats metadata']

[paths]
workdir = "C:/Users/oezdemir/.eubi-matrix/m41"

[pythons]
eubi = "C:/Users/oezdemir/miniforge3/envs/pythonenv/python.exe"
build = "C:/Users/oezdemir/.eubi-matrix/bvenv041/Scripts/python.exe"

[samples]
czi = "C:/Users/oezdemir/Desktop/data/microscopy/formats/czi/assorted/xyz__multiple_images.czi"
lif = "C:/Users/oezdemir/Desktop/data/microscopy/formats/lif/ome-samples/20191025 Test FRET 585. 423, 426.lif"
plate = "C:/Users/oezdemir/Desktop/data/microscopy/plates/cv7000/bia-S-BIAD1013-cv7000/1093684368.wpi"
bdv = "C:/Users/oezdemir/Desktop/data/microscopy/formats/h5/bdv/osf-bufza-bigstitcher/grid-3d-stitched-h5/dataset.xml"
jxr = "C:/Users/oezdemir/Desktop/data/microscopy/formats/czi/os-zeiss/Zeiss-5-JXR.czi"

# The candidates, from the working trees (uncommitted changes included).
[candidates.dyna-zarr]
path = "C:/Users/oezdemir/Desktop/vscode_projects/WS-OmeZarrPyramid/dyna_zarr"

[candidates.eubi-bridge]
path = "C:/Users/oezdemir/Desktop/vscode_projects/WS-EuBI-Bridge"

[candidates.eubi-bridge-lite]
path = "C:/Users/oezdemir/Desktop/vscode_projects/WS-EuBI-Bridge"
command = ["{python}", "tools/build_lite.py"]
dist = "dist"

[axes]
dyna-zarr = ["0.1.3", "candidate"]
micro-reader = ["0.4.2", "0.4.3"]

[[consumers]]
name = "eubi-bridge"
versions = ["0.4.0", "candidate"]
python = "eubi"
samples = ["czi", "lif", "plate", "bdv", "jxr"]
smoke = ["{bin}/eubi", "to_zarr", "{sample}", "{out}"]

[[consumers]]
name = "eubi-bridge-lite"
versions = ["0.4.0", "candidate"]
python = "eubi"
samples = ["czi", "lif", "plate", "bdv", "jxr"]
smoke = ["{bin}/eubi", "to_zarr", "{sample}", "{out}"]

# Expectations: none; every cell passes (default).

[[resolve]]
name = "fresh eubi-bridge (with the candidates: 0.4.1, dyna 0.1.4, micro-reader 0.4.3)"
python = "eubi"
requirements = ["eubi-bridge"]

[[resolve]]
name = "fresh eubi-bridge-lite (with the candidates)"
python = "eubi"
requirements = ["eubi-bridge-lite"]

[[resolve]]
name = "eubi-bridge<0.4.1 (stay on 0.4.0: it takes dyna 0.1.4 and micro-reader 0.4.3)"
python = "eubi"
requirements = ["eubi-bridge<0.4.1"]
